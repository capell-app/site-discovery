    <rect x="892" y="112" width="156" height="54" rx="12" fill="#0f766e"/>
    <text x="926" y="148" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Sitemap</text>
    <rect x="112" y="212" width="976" height="70" rx="12" fill="#f1f5f9"/>
