    <text x="590" y="256" fill="#334155" font-family="Arial, sans-serif" font-size="22" font-weight="700">Status</text>
    <text x="790" y="256" fill="#334155" font-family="Arial, sans-serif" font-size="22" font-weight="700">Updated</text>
    <g font-family="Arial, sans-serif" font-size="24" fill="#0f172a">
