<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
    <title id="title">Public URL Registry parity page</title>
    <desc id="desc">An admin registry showing canonical URLs and generated output coverage statuses.</desc>
    <rect width="1200" height="760" fill="#f8fafc"/>
    <rect x="72" y="72" width="1056" height="616" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="112" y="148" fill="#0f172a" font-family="Arial, sans-serif" font-size="44" font-weight="700">Public URL Registry</text>
    <rect x="112" y="204" width="976" height="64" rx="12" fill="#f1f5f9"/>
    <g fill="#334155" font-family="Arial, sans-serif" font-size="19" font-weight="700">
        <text x="136" y="244">Canonical URL</text>
        <text x="560" y="244">Sitemap</text>
        <text x="690" y="244">AI</text>
        <text x="790" y="244">Search</text>
        <text x="922" y="244">Cache</text>
    </g>
    <g font-family="Arial, sans-serif" font-size="22" fill="#0f172a">
        <text x="136" y="336">https://example.com/</text>
        <text x="136" y="424">https://example.com/services</text>
        <text x="136" y="512">https://example.com/contact</text>
    </g>
    <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
        <rect x="552" y="304" width="88" height="34" rx="17" fill="#dcfce7"/>
        <text x="568" y="327" fill="#166534">Present</text>
        <rect x="682" y="304" width="88" height="34" rx="17" fill="#dcfce7"/>
        <text x="698" y="327" fill="#166534">Present</text>
        <rect x="780" y="392" width="102" height="34" rx="17" fill="#fef9c3"/>
        <text x="800" y="415" fill="#854d0e">Unknown</text>
        <rect x="914" y="480" width="88" height="34" rx="17" fill="#fee2e2"/>
        <text x="930" y="503" fill="#991b1b">Missing</text>
    </g>
    <text x="112" y="626" fill="#0f766e" font-family="Arial, sans-serif" font-size="26" font-weight="700">One canonical registry for generated output coverage</text>
</svg>
