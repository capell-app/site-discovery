<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
    <title id="title">Sitemap generation tool</title>
    <desc id="desc">An admin tool panel showing sitemap generation controls and domain output status.</desc>
    <rect width="1200" height="760" fill="#f8fafc"/>
    <rect x="72" y="72" width="1056" height="616" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="112" y="150" fill="#0f172a" font-family="Arial, sans-serif" font-size="48" font-weight="700">Update sitemaps</text>
    <text x="112" y="196" fill="#475569" font-family="Arial, sans-serif" font-size="24">Generate XML output for every discoverable public URL.</text>
    <rect x="112" y="248" width="280" height="72" rx="14" fill="#0f766e"/>
    <text x="152" y="294" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Generate now</text>
    <rect x="112" y="388" width="976" height="76" rx="14" fill="#f1f5f9"/>
    <text x="144" y="435" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">example.com</text>
    <text x="498" y="435" fill="#166534" font-family="Arial, sans-serif" font-size="22">Generated</text>
    <text x="800" y="435" fill="#475569" font-family="Arial, sans-serif" font-size="22">1,284 URLs</text>
    <rect x="112" y="500" width="976" height="76" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="144" y="547" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">example.com/uk</text>
    <text x="498" y="547" fill="#166534" font-family="Arial, sans-serif" font-size="22">Unchanged</text>
    <text x="800" y="547" fill="#475569" font-family="Arial, sans-serif" font-size="22">412 URLs</text>
    <path d="M974 245a58 58 0 1 1-1 0m0 20a38 38 0 1 0 1 0" fill="#14b8a6"/>
</svg>
