<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
    <title id="title">Generated XML sitemap output</title>
    <desc id="desc">Crawler-readable XML sitemap output generated by Site Discovery.</desc>
    <rect width="1200" height="760" fill="#0f172a"/>
    <rect x="72" y="72" width="1056" height="616" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="112" y="148" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="34" font-weight="700">/sitemap-xml</text>
    <g font-family="Courier New, monospace" font-size="26">
        <text x="112" y="232" fill="#93c5fd">&lt;urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"&gt;</text>
        <text x="150" y="290" fill="#c4b5fd">&lt;url&gt;</text>
        <text x="188" y="342" fill="#f8fafc">&lt;loc&gt;https://example.com/&lt;/loc&gt;</text>
        <text x="188" y="394" fill="#f8fafc">&lt;lastmod&gt;2026-06-05&lt;/lastmod&gt;</text>
        <text x="188" y="446" fill="#f8fafc">&lt;changefreq&gt;weekly&lt;/changefreq&gt;</text>
        <text x="150" y="498" fill="#c4b5fd">&lt;/url&gt;</text>
        <text x="112" y="556" fill="#93c5fd">&lt;/urlset&gt;</text>
    </g>
    <rect x="806" y="596" width="196" height="48" rx="24" fill="#14b8a6"/>
    <text x="846" y="628" fill="#042f2e" font-family="Arial, sans-serif" font-size="21" font-weight="700">XML ready</text>
</svg>
